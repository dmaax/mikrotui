name: Publish to Crates.io

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --all

      - name: Check version on Crates.io and Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          CURRENT_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "Current package version in Cargo.toml: $CURRENT_VERSION"

          CRATE_EXISTS=$(curl -s https://crates.io/api/v1/crates/mikrotui | jq -r ".versions[].num" | grep -w "$CURRENT_VERSION" || true)

          if [ -n "$CRATE_EXISTS" ]; then
            echo "✅ Version $CURRENT_VERSION is already published on Crates.io. Skipping publish step."
          else
            echo "🚀 Version $CURRENT_VERSION is new! Publishing to Crates.io..."
            cargo publish
          fi
