[package]
name = "mikrotui"
version = "0.2.0"
edition = "2021"
authors = ["dmaax"]
description = "A modern WinBox-inspired Terminal User Interface (TUI) for MikroTik RouterOS via SSH"
readme = "README.md"
repository = "https://github.com/dmaax/mikrotui"
homepage = "https://github.com/dmaax/mikrotui"
license = "MIT"
keywords = ["mikrotik", "routeros", "tui", "winbox", "ssh"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    ".gitignore",
    "target/",
]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.40", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
async-trait = "0.1"
dirs = "5.0"
inquire = "0.7"
